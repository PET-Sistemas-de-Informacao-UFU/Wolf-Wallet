name: 🐺 Keep Alive + Sync

on:
  schedule:
    # A cada 3 horas, no minuto 17 (00:17, 03:17, 06:17, ... UTC).
    # Streamlit Community Cloud hiberna após ~12h SEM tráfego. O cron do
    # GitHub Actions não é pontual: no histórico do projeto, as execuções
    # atrasaram 2,5 h em mediana (até ~6 h) e algumas foram puladas, deixando
    # intervalos de até 14,6 h com o cron anterior de 6 h. Com 3 h há folga
    # para absorver atrasos e execuções perdidas. O minuto 17 evita o pico de
    # carga do GitHub na hora cheia, quando os atrasos são maiores.
    # Ao acordar o app (cold start), a auto-sync é disparada automaticamente.
    - cron: "17 */3 * * *"
  workflow_dispatch: # permite rodar manualmente pelo GitHub

# Evita execuções sobrepostas (ex.: manual + agendada ao mesmo tempo)
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # Job 1 — Mantém o Supabase ativo com um ping DIRETO ao banco.
  # Independente do Streamlit: mesmo que o wake do app falhe, o banco
  # continua sendo tocado e não hiberna (free tier pausa após ~7 dias).
  # -------------------------------------------------------------------
  keep-supabase-alive:
    name: Ping Supabase (evita hibernação)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ping direto no banco (SELECT 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️  Secret DATABASE_URL não configurado — pulando ping direto do Supabase."
            echo "   Configure em: Settings → Secrets and variables → Actions → New repository secret"
            echo "   (use a MESMA connection string do app, de preferência a do Connection Pooler / porta 6543,"
            echo "    que suporta IPv4 nos runners do GitHub)."
            exit 0
          fi

          # Usa SQLAlchemy (mesmo parser da app) — robusto a senhas com
          # caracteres especiais (@, *, &) que quebram o psycopg2/libpq puro.
          python -m pip install --quiet "sqlalchemy>=2.0,<3.0" "psycopg2-binary>=2.9,<3"

          python - <<'PY'
          import os, sys
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          try:
              # Fixa o driver psycopg2. A partir do SQLAlchemy 2.1 o esquema
              # "postgresql://" usa o psycopg (v3) por padrão, que não está
              # instalado aqui — causa de todas as falhas deste job desde
              # 24/09/2026 ("No module named 'psycopg'"). Mesma correção
              # aplicada ao app em config/database.py.
              url = make_url(os.environ["DATABASE_URL"]).set(drivername="postgresql+psycopg2")
              engine = create_engine(url, pool_pre_ping=True)
              with engine.connect() as conn:
                  conn.execute(text("SELECT 1"))
              print("✅ Supabase respondeu — projeto mantido ativo.")
          except Exception as e:
              print(f"❌ Falha ao conectar no Supabase: {e}")
              print("   Dica: use a MESMA connection string do app (.streamlit/secrets.toml),")
              print("   de preferência a do Connection Pooler (porta 6543), que suporta IPv4.")
              sys.exit(1)
          PY

  # -------------------------------------------------------------------
  # Job 2 — Acorda o Streamlit Community Cloud e dispara a auto-sync.
  # Roda em paralelo ao Job 1, então uma falha aqui não impede o ping
  # do Supabase (e vice-versa).
  # -------------------------------------------------------------------
  wake-streamlit:
    name: Acordar Streamlit + disparar sync
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y > /dev/null 2>&1
          npm install playwright > /dev/null 2>&1
          npx playwright install chromium --with-deps > /dev/null 2>&1

      - name: Wake up Wolf Wallet with headless browser
        run: |
          cat << 'SCRIPT' > ping.mjs
          import { chromium } from 'playwright';

          const APP_URL = 'https://wolf-wallet.streamlit.app/';
          const NAV_TIMEOUT = 120_000;     // carregamento da página externa
          const DETECT_TIMEOUT = 90_000;   // tempo para decidir: dormindo ou acordado
          const BOOT_TIMEOUT = 360_000;    // cold start após o clique (pode levar minutos)
          const RENDER_TIMEOUT = 90_000;   // tempo para o script do app renderizar a tela
          const STABILIZE_MS = 45_000;     // mantém a sessão aberta p/ main() disparar a sync

          // Botão da página de hibernação do Streamlit Cloud. O rótulo já mudou
          // algumas vezes; por isso há mais de uma variação.
          const WAKE_SELECTOR = [
            'button:has-text("get this app back up")',
            'button:has-text("back up")',
            '[data-testid="wakeup-button-viewer"]',
            '[data-testid="wakeup-button-owner"]',
          ].join(', ');

          // Container do app. No Community Cloud o app roda DENTRO de um iframe
          // (/~/+/); procurar no documento principal nunca o encontra — por isso
          // a versão anterior sempre esperava o tempo máximo e seguia "às cegas".
          const APP_SELECTOR = '[data-testid="stApp"], [data-testid="stAppViewContainer"]';
          // Algum conteúdo renderizado pelo script Python (tela de login, etc.):
          // indica que main() rodou — e, com ele, o critério de sincronização.
          const RENDERED_SELECTOR =
            '[data-testid="stForm"], [data-testid="stButton"], [data-testid="stMarkdownContainer"]';

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          // Procura um seletor em todos os frames, exceto o documento principal.
          async function countInAppFrames(page, selector) {
            let total = 0;
            for (const frame of page.frames()) {
              if (frame === page.mainFrame()) continue;
              total += await frame.locator(selector).count().catch(() => 0);
            }
            return total;
          }

          async function wakeButtonVisible(page) {
            return page.locator(WAKE_SELECTOR).first().isVisible().catch(() => false);
          }

          // Aguarda até que a página indique um estado conhecido.
          // NOTA: locator.isVisible() NÃO espera (a opção timeout é ignorada
          // pelo Playwright). A versão anterior consultava o botão logo após o
          // 'domcontentloaded', antes de ele ser desenhado, concluía "já estava
          // acordado" e nunca clicava — o app continuava hibernado.
          async function detectState(page, timeoutMs) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if (await wakeButtonVisible(page)) return 'sleeping';
              if ((await countInAppFrames(page, APP_SELECTOR)) > 0) return 'awake';
              await sleep(2_000);
            }
            return 'unknown';
          }

          async function waitFor(page, selector, timeoutMs) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              if ((await countInAppFrames(page, selector)) > 0) return true;
              await sleep(3_000);
            }
            return false;
          }

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            page.setDefaultTimeout(NAV_TIMEOUT);
            let ok = false;

            console.log('🐺 Abrindo Wolf Wallet no headless browser...');
            try {
              // NÃO usar 'networkidle': o Streamlit mantém um WebSocket aberto.
              const response = await page.goto(APP_URL, {
                waitUntil: 'domcontentloaded',
                timeout: NAV_TIMEOUT,
              });
              console.log(`➡️  Status HTTP: ${response?.status()}`);

              let state = await detectState(page, DETECT_TIMEOUT);
              if (state === 'unknown') {
                console.log('🔁 Estado indefinido — recarregando a página uma vez...');
                await page.reload({ waitUntil: 'domcontentloaded', timeout: NAV_TIMEOUT });
                state = await detectState(page, DETECT_TIMEOUT);
              }
              console.log(`🔎 Estado detectado: ${state}`);

              if (state === 'sleeping') {
                console.log('💤 App estava dormindo — clicando em "acordar"...');
                await page.locator(WAKE_SELECTOR).first().click();
                const booted = await waitFor(page, APP_SELECTOR, BOOT_TIMEOUT);
                console.log(booted
                  ? '✅ App acordou (container carregado).'
                  : '❌ App não acordou dentro do tempo limite.');
                state = booted ? 'awake' : 'unknown';
              } else if (state === 'awake') {
                console.log('✅ App já estava acordado (container encontrado no iframe).');
              }

              if (state === 'awake') {
                const rendered = await waitFor(page, RENDERED_SELECTOR, RENDER_TIMEOUT);
                if (rendered) {
                  console.log('✅ Script do app executou (conteúdo renderizado).');
                  // Mantém a sessão aberta: main() roda ensure_sync_freshness()
                  // e, se os dados tiverem mais de 24 h, inicia a sincronização
                  // em segundo plano no servidor.
                  console.log(`⏳ Aguardando ${STABILIZE_MS / 1000}s com a sessão aberta...`);
                  await page.waitForTimeout(STABILIZE_MS);
                  ok = true;
                } else {
                  console.log('❌ Container presente, mas o conteúdo do app não foi renderizado.');
                }
              }
            } catch (err) {
              console.error('❌ Erro:', err.message);
            } finally {
              await page.screenshot({ path: ok ? 'screenshot.png' : 'screenshot-error.png', fullPage: true })
                .catch(() => {});
              console.log(`📄 Título da página: "${await page.title().catch(() => '?')}"`);
              await browser.close();
            }

            if (!ok) {
              // Falha explícita: o job fica vermelho e o GitHub notifica por
              // e-mail, em vez de reportar sucesso com o app hibernado.
              console.error('❌ Keep-alive NÃO confirmou o app acordado.');
              process.exit(1);
            }
            console.log('🎉 Keep-alive concluído.');
          })();
          SCRIPT

          node ping.mjs

      - name: Upload screenshot (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wolf-wallet-screenshot
          path: screenshot*.png
          retention-days: 3
